http:
  routers:
    # Auth Service - Public routes
    auth:
      rule: "Host(`api.example.com`) && PathPrefix(`/auth`)"
      entryPoints:
        - web
      service: auth-service
      
    # Auth Service - Protected route
    auth-changepass:
      rule: "Host(`api.example.com`) && PathPrefix(`/auth/change-password`)"
      entryPoints:
        - web
      middlewares:
        - jwt-validation
      service: auth-service

    # User Service - Protected routes
    user-me:
      rule: "Host(`api.example.com`) && PathPrefix(`/me`)"
      entryPoints:
        - web
      middlewares:
        - jwt-validation
      service: user-service
      
    user-admin:
      rule: "Host(`api.example.com`) && PathPrefix(`/admin`)"
      entryPoints:
        - web
      middlewares:
        - jwt-validation
      service: user-service

    # Product Service - Public routes (higher priority)
    product-public:
      rule: "Host(`api.example.com`) && PathPrefix(`/products/get`)"
      entryPoints:
        - web
      priority: 100
      service: product-service
      
    # Product Service - Protected routes
    product-service:
      rule: "Host(`api.example.com`) && PathPrefix(`/products`)"
      entryPoints:
        - web
      middlewares:
        - jwt-validation
      service: product-service

    # Cart Service - Protected routes
    cart-service:
      rule: "Host(`api.example.com`) && PathPrefix(`/cart`)"
      entryPoints:
        - web
      middlewares:
        - jwt-validation
      service: cart-service

    # Order Service - Protected routes
    order-service:
      rule: "Host(`api.example.com`) && PathPrefix(`/order`)"
      entryPoints:
        - web
      middlewares:
        - jwt-validation
      service: order-service

    # Search Service - Public routes
    search-service:
      rule: "Host(`api.example.com`) && PathPrefix(`/search`)"
      entryPoints:
        - web
      service: search-service

    # Payment Service - Protected routes
    payment-service:
      rule: "Host(`api.example.com`) && PathPrefix(`/payment`)"
      entryPoints:
        - web
      middlewares:
        - jwt-validation
      service: payment-service
      
    # Payment Webhook - No JWT validation
    payment-webhook:
      rule: "Host(`api.example.com`) && PathPrefix(`/payment/webhook`)"
      entryPoints:
        - web
      priority: 100
      middlewares:
        - stripe-webhook-passthrough
      service: payment-service

    # Review Service - Mixed routes
    review-public:
      rule: "Host(`api.example.com`) && PathPrefix(`/products/reviews`)"
      entryPoints:
        - web
      priority: 100
      service: review-service
      
    review-protected:
      rule: "Host(`api.example.com`) && PathPrefix(`/products/create-reviews`)"
      entryPoints:
        - web
      priority: 100
      middlewares:
        - jwt-validation
      service: review-service

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://golang-project-auth-service-1:8081"
        
    user-service:
      loadBalancer:
        servers:
          - url: "http://golang-project-user-service-1:8095"
          
    product-service:
      loadBalancer:
        servers:
          - url: "http://golang-project-product-service-1:8082"
          
    cart-service:
      loadBalancer:
        servers:
          - url: "http://golang-project-cart-service-1:8083"
          
    order-service:
      loadBalancer:
        servers:
          - url: "http://golang-project-order-service-1:8084"
          
    search-service:
      loadBalancer:
        servers:
          - url: "http://golang-project-search-service-1:8086"
          
    payment-service:
      loadBalancer:
        servers:
          - url: "http://golang-project-payment-service-1:8088"
          
    review-service:
      loadBalancer:
        servers:
          - url: "http://review-service:8089"

  middlewares:
    jwt-validation:
      plugin:
        jwt-validator:
          secret: "{{ env `JWT_SECRET` }}"   
          headerName: "X-User-ID"
          claims:
            - claim: "user_type"
              header: "X-User-Type"

    cors-headers:
      headers:
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://127.0.0.1:3000"
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "Accept"
          - "X-Requested-With"
          - "X-User-ID"
          - "X-User-Type"
          - "X-Nextjs-Data"
          - "x-nextjs-data"
        accessControlAllowCredentials: true
        accessControlMaxAge: 600
        addVaryHeader: true

    stripe-webhook-passthrough:
      buffering:
        maxRequestBodyBytes: 0
        memRequestBodyBytes: 0
        retryExpression: "IsNetworkError() && Attempts() < 2"